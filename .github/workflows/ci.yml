name: CI

on: push

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck, lint, unit tests, level validation, build)
        run: pnpm verify

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Regenerates the answer keys from the pinned Python packages into a temporary
  # folder and compares them with fixtures/golden by value (structure, names and
  # integers exactly; other numbers within 1e-10), because Linux x86 and the
  # machine that committed them may differ in the last bits. Never rewrites the
  # committed files or MANIFEST.json.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/fixtures/requirements.txt

      - name: Install pinned Python packages
        run: python -m pip install -r tools/fixtures/requirements.txt

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate fixtures into a temporary folder
        run: pnpm fixtures --out "$RUNNER_TEMP/golden-regenerated"

      - name: Compare with the committed fixtures by value
        run: pnpm compare:fixtures "$RUNNER_TEMP/golden-regenerated"

      - name: Committed fixtures are untouched
        run: |
          git status --porcelain --untracked-files=all -- fixtures/golden
          test -z "$(git status --porcelain --untracked-files=all -- fixtures/golden)"
